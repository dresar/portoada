<div class="p-6">
    <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-semibold text-gray-800">{{ form_title }}</h3>
        <button type="button" onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <form method="post" action="{{ form_url }}" enctype="multipart/form-data" id="modal-form">
        {% csrf_token %}
        
        <div class="space-y-4">
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-gray-700 mb-1">
                        {{ field.label }}
                        {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
                    </label>
                    
                    {% if field.errors %}
                        {{ field }}
                        <div class="text-red-500 text-sm mt-1">
                            {% for error in field.errors %}
                                {{ error }}
                            {% endfor %}
                        </div>
                    {% else %}
                        {{ field }}
                    {% endif %}
                    
                    {% if field.help_text %}
                        <p class="text-gray-500 text-xs mt-1">{{ field.help_text }}</p>
                    {% endif %}
                </div>
            {% endfor %}
        </div>
        
        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 transition">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                Save
            </button>
        </div>
    </form>
</div>

<script>
    $(document).ready(function() {
        $('#modal-form').on('submit', function(e) {
            e.preventDefault();
            submitForm($(this));
        });
        
        // Style form elements with Tailwind classes
        $('#modal-form input[type="text"], #modal-form input[type="email"], #modal-form input[type="number"], #modal-form input[type="url"], #modal-form input[type="password"], #modal-form textarea').addClass('mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50');
        
        $('#modal-form select').addClass('mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50');
        
        $('#modal-form input[type="checkbox"]').addClass('rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50 h-4 w-4');
        
        // Handle file inputs
        $('#modal-form input[type="file"]').addClass('block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100');
    });
</script>
