<div class="p-6">
    <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-semibold text-gray-800">Edit Skill</h3>
        <button type="button" onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <form method="post" action="{% url 'portfolio_admin:skill_update' skill.id %}" id="modal-form">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div class="form-group">
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Skill Name <span class="text-red-500">*</span></label>
                <input type="text" id="name" name="name" value="{{ skill.name }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50" required>
            </div>
            
            <div class="form-group">
                <label for="category" class="block text-sm font-medium text-gray-700 mb-1">Category <span class="text-red-500">*</span></label>
                <input type="text" id="category" name="category" value="{{ skill.category }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50" required>
                <p class="text-xs text-gray-500 mt-1">E.g., Frontend, Backend, Design, etc.</p>
            </div>
            
            <div class="form-group">
                <label for="proficiency" class="block text-sm font-medium text-gray-700 mb-1">Proficiency (%) <span class="text-red-500">*</span></label>
                <div class="flex items-center">
                    <input type="range" id="proficiency" name="proficiency" min="0" max="100" value="{{ skill.proficiency }}" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer" oninput="updateProficiencyValue(this.value)">
                    <span id="proficiency-value" class="ml-2 text-sm text-gray-700 w-10">{{ skill.proficiency }}%</span>
                </div>
            </div>
            
            <div class="form-group">
                <label for="icon" class="block text-sm font-medium text-gray-700 mb-1">Icon (Font Awesome)</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 rounded-l-md border border-r-0 border-gray-300 bg-gray-50 text-gray-500">
                        <i class="{{ skill.icon }}"></i>
                    </span>
                    <input type="text" id="icon" name="icon" value="{{ skill.icon }}" placeholder="fa-code" class="flex-1 min-w-0 block w-full px-3 py-2 rounded-none rounded-r-md border border-gray-300 focus:ring-blue-500 focus:border-blue-500">
                </div>
                <p class="text-xs text-gray-500 mt-1">Enter Font Awesome class name (e.g., fa-react, fa-python)</p>
            </div>
            
            <div class="form-group">
                <label for="color" class="block text-sm font-medium text-gray-700 mb-1">Color</label>
                <input type="color" id="color" name="color" value="{{ skill.color|default:'#3B82F6' }}" class="h-10 w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50">
            </div>
            
            <div class="form-group">
                <label for="order" class="block text-sm font-medium text-gray-700 mb-1">Display Order</label>
                <input type="number" id="order" name="order" min="0" value="{{ skill.order|default:0 }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50">
                <p class="text-xs text-gray-500 mt-1">Lower numbers appear first</p>
            </div>
        </div>
        
        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 transition">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                Update
            </button>
        </div>
    </form>
</div>

<script>
    function updateProficiencyValue(val) {
        document.getElementById('proficiency-value').textContent = val + '%';
    }
    
    $(document).ready(function() {
        $('#modal-form').on('submit', function(e) {
            e.preventDefault();
            
            var formData = new FormData(this);
            
            $.ajax({
                url: $(this).attr('action'),
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                success: function(data) {
                    if (data.status === 'success') {
                        closeModal();
                        location.reload();
                    } else {
                        alert('Error: ' + (data.message || 'An error occurred'));
                    }
                },
                error: function(xhr, status, error) {
                    alert('An error occurred: ' + error);
                }
            });
        });
    });
</script>
