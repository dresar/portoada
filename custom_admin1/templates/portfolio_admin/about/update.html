<div class="p-6">
    <div class="flex justify-between items-center border-b pb-3 mb-4">
        <h3 class="text-xl font-semibold text-gray-800">Edit About</h3>
        <button type="button" onclick="closeModal()" class="text-gray-500 hover:text-gray-700">
            <i class="fas fa-times"></i>
        </button>
    </div>
    
    <form method="post" action="{% url 'portfolio_admin:about_update' about.id %}" enctype="multipart/form-data" id="modal-form">
        {% csrf_token %}
        
        <div class="space-y-4">
            <div class="form-group">
                <label for="title" class="block text-sm font-medium text-gray-700 mb-1">Title <span class="text-red-500">*</span></label>
                <input type="text" id="title" name="title" value="{{ about.title }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50" required>
            </div>
            
            <div class="form-group">
                <label for="subtitle" class="block text-sm font-medium text-gray-700 mb-1">Subtitle <span class="text-red-500">*</span></label>
                <input type="text" id="subtitle" name="subtitle" value="{{ about.subtitle }}" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50" required>
            </div>
            
            <div class="form-group">
                <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description <span class="text-red-500">*</span></label>
                <textarea id="description" name="description" rows="4" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-500 focus:ring-opacity-50" required>{{ about.description }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="image" class="block text-sm font-medium text-gray-700 mb-1">Image</label>
                {% if about.image %}
                <div class="mb-2">
                    <img src="{{ about.image.url }}" alt="Current Image" class="h-32 w-auto object-cover rounded">
                </div>
                {% endif %}
                <input type="file" id="image" name="image" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <p class="text-xs text-gray-500 mt-1">Leave empty to keep current image</p>
            </div>
            
            <div class="form-group">
                <label for="resume" class="block text-sm font-medium text-gray-700 mb-1">Resume</label>
                {% if about.resume %}
                <div class="mb-2">
                    <a href="{{ about.resume.url }}" target="_blank" class="text-blue-600 hover:text-blue-800 flex items-center">
                        <i class="fas fa-file-pdf mr-2"></i> Current Resume
                    </a>
                </div>
                {% endif %}
                <input type="file" id="resume" name="resume" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                <p class="text-xs text-gray-500 mt-1">Leave empty to keep current resume</p>
            </div>
            
            <div class="form-group">
                <div class="flex items-center">
                    <input type="checkbox" id="is_active" name="is_active" {% if about.is_active %}checked{% endif %} class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded">
                    <label for="is_active" class="ml-2 block text-sm text-gray-900">Is Active</label>
                </div>
                <p class="text-xs text-gray-500 mt-1">Only one about section can be active at a time</p>
            </div>
        </div>
        
        <div class="mt-6 flex justify-end space-x-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-200 text-gray-800 rounded hover:bg-gray-300 transition">
                Cancel
            </button>
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">
                Update
            </button>
        </div>
    </form>
</div>

<script>
    $(document).ready(function() {
        $('#modal-form').on('submit', function(e) {
            e.preventDefault();
            
            var formData = new FormData(this);
            
            $.ajax({
                url: $(this).attr('action'),
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                headers: {
                    'X-CSRFToken': '{{ csrf_token }}'
                },
                success: function(data) {
                    if (data.status === 'success') {
                        closeModal();
                        location.reload();
                    } else {
                        alert('Error: ' + (data.message || 'An error occurred'));
                    }
                },
                error: function(xhr, status, error) {
                    alert('An error occurred: ' + error);
                }
            });
        });
    });
</script>
