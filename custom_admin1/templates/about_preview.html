<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Preview</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-100 min-h-screen">
    <div class="container mx-auto px-4 py-8">
        <div class="bg-white rounded-lg shadow-lg overflow-hidden max-w-4xl mx-auto">
            <div class="md:flex">
                <!-- Image Section -->
                <div class="md:w-2/5">
                    {% if about.image %}
                    <div class="h-full">
                        <img src="{{ about.image.url }}" alt="{{ about.title }}" class="h-full w-full object-cover">
                    </div>
                    {% else %}
                    <div class="h-full w-full flex items-center justify-center bg-gray-200 text-gray-500 p-12">
                        <i class="fas fa-image text-6xl"></i>
                    </div>
                    {% endif %}
                </div>
                
                <!-- Content Section -->
                <div class="md:w-3/5 p-8">
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">{{ about.title }}</h1>
                    {% if about.subtitle %}
                    <h2 class="text-xl text-gray-600 mb-4">{{ about.subtitle }}</h2>
                    {% endif %}
                    
                    <div class="prose max-w-none text-gray-700 mb-6">
                        {{ about.description|linebreaks }}
                    </div>
                    
                    {% if about.resume %}
                    <div class="mt-6">
                        <a href="{{ about.resume.url }}" target="_blank" class="inline-flex items-center px-4 py-2 bg-blue-600 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-blue-700 active:bg-blue-900 focus:outline-none focus:border-blue-900 focus:ring ring-blue-300 disabled:opacity-25 transition ease-in-out duration-150">
                            <i class="fas fa-download mr-2"></i> Download Resume
                        </a>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
        
        <div class="mt-6 text-center">
            <a href="{% url 'portfolio_admin:about_list' %}" class="inline-flex items-center px-4 py-2 bg-gray-800 border border-transparent rounded-md font-semibold text-xs text-white uppercase tracking-widest hover:bg-gray-700 active:bg-gray-900 focus:outline-none focus:border-gray-900 focus:ring ring-gray-300 disabled:opacity-25 transition ease-in-out duration-150">
                <i class="fas fa-arrow-left mr-2"></i> Back to Admin
            </a>
        </div>
    </div>
</body>
</html>
