<!-- Modal Header -->
<div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
        {% if project %}Edit Proyek{% else %}Tambah Proyek Baru{% endif %}
    </h3>
    <button type="button" class="close-modal text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
        <i class="fas fa-times"></i>
        <span class="sr-only">Close modal</span>
    </button>
</div>

<!-- Modal Body -->
<div class="p-4 md:p-5">
    <form id="project-form" data-url="{% if project %}{% url 'custom_admin:project_ajax_update' project.id %}{% else %}{% url 'custom_admin:project_ajax_create' %}{% endif %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="grid gap-4 mb-4 grid-cols-1 md:grid-cols-2">
            <!-- Title -->
            <div class="col-span-2">
                <label for="title" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Judul Proyek <span class="text-red-500">*</span></label>
                <input type="text" name="title" id="title" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Masukkan judul proyek" required value="{% if project %}{{ project.title }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="title-error"></div>
            </div>
            
            <!-- Category -->
            <div class="col-span-2 md:col-span-1">
                <label for="category" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Kategori <span class="text-red-500">*</span></label>
                <input type="text" name="category" id="category" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Contoh: Web Development, Mobile App" required value="{% if project %}{{ project.category }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="category-error"></div>
            </div>
            
            <!-- Date -->
            <div class="col-span-2 md:col-span-1">
                <label for="date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tanggal <span class="text-red-500">*</span></label>
                <input type="date" name="date" id="date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required value="{% if project %}{{ project.date|date:'Y-m-d' }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="date-error"></div>
            </div>
            
            <!-- Image -->
            <div class="col-span-2">
                <label for="image" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Gambar</label>
                <input type="file" name="image" id="image" accept="image/*" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400">
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">PNG, JPG atau JPEG (Maks. 2MB)</p>
                {% if project.image %}
                <div class="mt-2 flex items-center">
                    <img src="{{ project.image.url }}" alt="{{ project.title }}" class="h-16 w-16 object-cover rounded">
                    <div class="ml-3">
                        <p class="text-sm text-gray-700 dark:text-gray-300">Gambar saat ini</p>
                        <div class="flex items-center mt-1">
                            <input type="checkbox" id="remove_image" name="remove_image" class="h-4 w-4 text-primary-600 focus:ring-primary-500 border-gray-300 dark:border-gray-600 rounded dark:bg-gray-700">
                            <label for="remove_image" class="ml-2 block text-sm text-gray-700 dark:text-gray-300">Hapus gambar</label>
                        </div>
                    </div>
                </div>
                {% endif %}
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="image-error"></div>
            </div>
            
            <!-- Description -->
            <div class="col-span-2">
                <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Deskripsi <span class="text-red-500">*</span></label>
                <textarea id="description" name="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Deskripsi tentang proyek ini..." required>{% if project %}{{ project.description }}{% endif %}</textarea>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="description-error"></div>
            </div>
            
            <!-- Demo URL -->
            <div class="col-span-2 md:col-span-1">
                <label for="demo_url" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">URL Demo</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 text-sm text-gray-900 bg-gray-200 border border-r-0 border-gray-300 rounded-l-md dark:bg-gray-600 dark:text-gray-400 dark:border-gray-600">
                        <i class="fas fa-external-link-alt"></i>
                    </span>
                    <input type="url" name="demo_url" id="demo_url" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-none rounded-r-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="https://example.com" value="{% if project %}{{ project.demo_url }}{% endif %}">
                </div>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="demo_url-error"></div>
            </div>
            
            <!-- GitHub URL -->
            <div class="col-span-2 md:col-span-1">
                <label for="github_url" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">URL GitHub</label>
                <div class="flex">
                    <span class="inline-flex items-center px-3 text-sm text-gray-900 bg-gray-200 border border-r-0 border-gray-300 rounded-l-md dark:bg-gray-600 dark:text-gray-400 dark:border-gray-600">
                        <i class="fab fa-github"></i>
                    </span>
                    <input type="url" name="github_url" id="github_url" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-none rounded-r-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="https://github.com/username/repo" value="{% if project %}{{ project.github_url }}{% endif %}">
                </div>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="github_url-error"></div>
            </div>
            
            <!-- Status & Featured Checkboxes -->
            <div class="col-span-2 grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <div class="flex items-center">
                        <input id="is_active" name="is_active" type="checkbox" class="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" {% if project.is_active %}checked{% endif %}>
                        <label for="is_active" class="ml-2 text-sm font-medium text-gray-900 dark:text-white">Aktif</label>
                    </div>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Proyek yang aktif akan ditampilkan di portfolio Anda.</p>
                </div>
                <div>
                    <div class="flex items-center">
                        <input id="is_featured" name="is_featured" type="checkbox" class="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" {% if project.is_featured %}checked{% endif %}>
                        <label for="is_featured" class="ml-2 text-sm font-medium text-gray-900 dark:text-white">Unggulan</label>
                    </div>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Proyek unggulan akan ditampilkan di bagian atas portfolio Anda.</p>
                </div>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <button type="submit" class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
                <i class="fas fa-save mr-2"></i>{% if project %}Perbarui{% else %}Simpan{% endif %}
            </button>
            <button type="button" class="close-modal text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-primary-300 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
                <i class="fas fa-times mr-2"></i>Batal
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('project-form');
        const imageInput = document.getElementById('image');
        const removeImageCheckbox = document.getElementById('remove_image');
        
        // Image preview
        if (imageInput) {
            imageInput.addEventListener('change', function() {
                if (this.files && this.files[0]) {
                    // If there's a remove checkbox and it's checked, uncheck it
                    if (removeImageCheckbox && removeImageCheckbox.checked) {
                        removeImageCheckbox.checked = false;
                    }
                }
            });
        }
        
        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.add('hidden');
                el.textContent = '';
            });
            
            const formData = new FormData(form);
            
            // Handle checkboxes
            if (!formData.has('is_active')) {
                formData.append('is_active', 'off');
            }
            
            if (!formData.has('is_featured')) {
                formData.append('is_featured', 'off');
            }
            
            fetch(form.dataset.url, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Close modal
                    closeModal();
                    
                    // Show success message
                    showToast('success', data.message);
                    
                    // Reload page after a short delay
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    // Show errors
                    if (data.errors) {
                        Object.keys(data.errors).forEach(key => {
                            const errorEl = document.getElementById(`${key}-error`);
                            if (errorEl) {
                                errorEl.textContent = data.errors[key].join(' ');
                                errorEl.classList.remove('hidden');
                            }
                        });
                    }
                    
                    // Show error message
                    showToast('error', data.message || 'Terjadi kesalahan. Silakan coba lagi.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('error', 'Terjadi kesalahan. Silakan coba lagi.');
            });
        });
    });
</script>
