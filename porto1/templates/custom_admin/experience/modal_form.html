<!-- Modal Header -->
<div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
        {% if experience %}Edit Pengalaman{% else %}Tambah Pengalaman Baru{% endif %}
    </h3>
    <button type="button" class="close-modal text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
        <i class="fas fa-times"></i>
        <span class="sr-only">Close modal</span>
    </button>
</div>

<!-- Modal Body -->
<div class="p-4 md:p-5">
    <form id="experience-form" data-url="{% if experience %}{% url 'custom_admin:experience_ajax_update' experience.id %}{% else %}{% url 'custom_admin:experience_ajax_create' %}{% endif %}" method="post">
        {% csrf_token %}
        
        <div class="grid gap-4 mb-4 grid-cols-1 md:grid-cols-2">
            <!-- Position -->
            <div class="col-span-2">
                <label for="position" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Posisi <span class="text-red-500">*</span></label>
                <input type="text" name="position" id="position" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Masukkan posisi" required value="{% if experience %}{{ experience.position }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="position-error"></div>
            </div>
            
            <!-- Company -->
            <div class="col-span-2 md:col-span-1">
                <label for="company" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Perusahaan <span class="text-red-500">*</span></label>
                <input type="text" name="company" id="company" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Nama perusahaan" required value="{% if experience %}{{ experience.company }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="company-error"></div>
            </div>
            
            <!-- Location -->
            <div class="col-span-2 md:col-span-1">
                <label for="location" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Lokasi <span class="text-red-500">*</span></label>
                <input type="text" name="location" id="location" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Kota, Negara" required value="{% if experience %}{{ experience.location }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="location-error"></div>
            </div>
            
            <!-- Start Date -->
            <div class="col-span-2 md:col-span-1">
                <label for="start_date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tanggal Mulai <span class="text-red-500">*</span></label>
                <input type="date" name="start_date" id="start_date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required value="{% if experience %}{{ experience.start_date|date:'Y-m-d' }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="start_date-error"></div>
            </div>
            
            <!-- End Date / Current -->
            <div class="col-span-2 md:col-span-1">
                <div class="flex items-center mb-2">
                    <input id="is_current" name="is_current" type="checkbox" class="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" {% if experience.is_current %}checked{% endif %} onchange="toggleEndDate()">
                    <label for="is_current" class="ml-2 text-sm font-medium text-gray-900 dark:text-white">Saya masih bekerja di sini</label>
                </div>
                <div id="end-date-container" {% if experience.is_current %}class="hidden"{% endif %}>
                    <label for="end_date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tanggal Selesai <span class="text-red-500">*</span></label>
                    <input type="date" name="end_date" id="end_date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" {% if not experience.is_current %}required{% endif %} value="{% if experience and not experience.is_current %}{{ experience.end_date|date:'Y-m-d' }}{% endif %}">
                </div>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="end_date-error"></div>
            </div>
            
            <!-- Description -->
            <div class="col-span-2">
                <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Deskripsi <span class="text-red-500">*</span></label>
                <textarea id="description" name="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Deskripsi tentang pengalaman kerja ini..." required>{% if experience %}{{ experience.description }}{% endif %}</textarea>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="description-error"></div>
            </div>
            
            <!-- Status -->
            <div class="col-span-2">
                <div class="flex items-center">
                    <input id="is_active" name="is_active" type="checkbox" class="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" {% if experience.is_active %}checked{% endif %}>
                    <label for="is_active" class="ml-2 text-sm font-medium text-gray-900 dark:text-white">Aktif</label>
                </div>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Pengalaman yang aktif akan ditampilkan di portfolio Anda.</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <button type="submit" class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
                <i class="fas fa-save mr-2"></i>{% if experience %}Perbarui{% else %}Simpan{% endif %}
            </button>
            <button type="button" class="close-modal text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-primary-300 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
                <i class="fas fa-times mr-2"></i>Batal
            </button>
        </div>
    </form>
</div>

<script>
    function toggleEndDate() {
        const isCurrentCheckbox = document.getElementById('is_current');
        const endDateContainer = document.getElementById('end-date-container');
        const endDateInput = document.getElementById('end_date');
        
        if (isCurrentCheckbox.checked) {
            endDateContainer.classList.add('hidden');
            endDateInput.removeAttribute('required');
            endDateInput.value = '';
        } else {
            endDateContainer.classList.remove('hidden');
            endDateInput.setAttribute('required', 'required');
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('experience-form');
        const isCurrentCheckbox = document.getElementById('is_current');
        
        // Initialize end date visibility
        toggleEndDate();
        
        // Add event listener for is_current checkbox
        isCurrentCheckbox.addEventListener('change', toggleEndDate);
        
        // Form submission
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.add('hidden');
                el.textContent = '';
            });
            
            const formData = new FormData(form);
            
            // Handle checkboxes
            if (!formData.has('is_active')) {
                formData.append('is_active', 'off');
            }
            
            if (!formData.has('is_current')) {
                formData.append('is_current', 'off');
            }
            
            fetch(form.dataset.url, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Close modal
                    closeModal();
                    
                    // Show success message
                    showToast('success', data.message);
                    
                    // Reload page after a short delay
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    // Show errors
                    if (data.errors) {
                        Object.keys(data.errors).forEach(key => {
                            const errorEl = document.getElementById(`${key}-error`);
                            if (errorEl) {
                                errorEl.textContent = data.errors[key].join(' ');
                                errorEl.classList.remove('hidden');
                            }
                        });
                    }
                    
                    // Show error message
                    showToast('error', data.message || 'Terjadi kesalahan. Silakan coba lagi.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('error', 'Terjadi kesalahan. Silakan coba lagi.');
            });
        });
    });
</script>
