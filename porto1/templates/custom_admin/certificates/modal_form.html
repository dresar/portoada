<!-- Modal Header -->
<div class="flex items-center justify-between p-4 md:p-5 border-b rounded-t dark:border-gray-600">
    <h3 class="text-xl font-semibold text-gray-900 dark:text-white">
        {% if certificate %}Edit Sertifikat{% else %}Tambah Sertifikat Baru{% endif %}
    </h3>
    <button type="button" class="close-modal text-gray-400 bg-transparent hover:bg-gray-200 hover:text-gray-900 rounded-lg text-sm w-8 h-8 ms-auto inline-flex justify-center items-center dark:hover:bg-gray-600 dark:hover:text-white">
        <i class="fas fa-times"></i>
        <span class="sr-only">Close modal</span>
    </button>
</div>

<!-- Modal Body -->
<div class="p-4 md:p-5">
    <form id="certificate-form" data-url="{% if certificate %}{% url 'custom_admin:certificate_ajax_update' certificate.id %}{% else %}{% url 'custom_admin:certificate_ajax_create' %}{% endif %}" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        
        <div class="grid gap-4 mb-4 grid-cols-1 md:grid-cols-2">
            <!-- Name -->
            <div class="col-span-2">
                <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Nama Sertifikat <span class="text-red-500">*</span></label>
                <input type="text" name="name" id="name" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Masukkan nama sertifikat" required value="{% if certificate %}{{ certificate.name }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="name-error"></div>
            </div>
            
            <!-- Issuer -->
            <div class="col-span-2 md:col-span-1">
                <label for="issuer" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Penerbit <span class="text-red-500">*</span></label>
                <input type="text" name="issuer" id="issuer" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Nama penerbit sertifikat" required value="{% if certificate %}{{ certificate.issuer }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="issuer-error"></div>
            </div>
            
            <!-- Date -->
            <div class="col-span-2 md:col-span-1">
                <label for="date" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Tanggal <span class="text-red-500">*</span></label>
                <input type="date" name="date" id="date" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" required value="{% if certificate %}{{ certificate.date|date:'Y-m-d' }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="date-error"></div>
            </div>
            
            <!-- Credential ID -->
            <div class="col-span-2">
                <label for="credential_id" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Credential ID</label>
                <input type="text" name="credential_id" id="credential_id" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="ID kredensial sertifikat (opsional)" value="{% if certificate %}{{ certificate.credential_id }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="credential_id-error"></div>
            </div>
            
            <!-- URL -->
            <div class="col-span-2">
                <label for="url" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">URL Sertifikat</label>
                <input type="url" name="url" id="url" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="https://example.com/certificate" value="{% if certificate %}{{ certificate.url }}{% endif %}">
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="url-error"></div>
            </div>
            
            <!-- Image -->
            <div class="col-span-2">
                <label for="image" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Gambar Sertifikat</label>
                <input type="file" name="image" id="image" accept="image/*" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 dark:text-gray-400 focus:outline-none dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400">
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">PNG, JPG atau JPEG (Maks. 2MB)</p>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="image-error"></div>
                
                {% if certificate and certificate.image %}
                <div class="mt-2">
                    <p class="text-sm font-medium text-gray-900 dark:text-white mb-2">Gambar Saat Ini:</p>
                    <div class="relative w-40 h-auto border border-gray-200 dark:border-gray-700 rounded-lg overflow-hidden">
                        <img src="{{ certificate.image.url }}" alt="{{ certificate.name }}" class="w-full h-auto">
                    </div>
                </div>
                {% endif %}
            </div>
            
            <!-- Description -->
            <div class="col-span-2">
                <label for="description" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Deskripsi</label>
                <textarea id="description" name="description" rows="4" class="block p-2.5 w-full text-sm text-gray-900 bg-gray-50 rounded-lg border border-gray-300 focus:ring-primary-500 focus:border-primary-500 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Deskripsi tentang sertifikat ini...">{% if certificate %}{{ certificate.description }}{% endif %}</textarea>
                <div class="error-message text-red-500 text-sm mt-1 hidden" id="description-error"></div>
            </div>
            
            <!-- Status -->
            <div class="col-span-2">
                <div class="flex items-center">
                    <input id="is_active" name="is_active" type="checkbox" class="w-4 h-4 text-primary-600 bg-gray-100 border-gray-300 rounded focus:ring-primary-500 dark:focus:ring-primary-600 dark:ring-offset-gray-800 focus:ring-2 dark:bg-gray-700 dark:border-gray-600" {% if certificate.is_active %}checked{% endif %}>
                    <label for="is_active" class="ml-2 text-sm font-medium text-gray-900 dark:text-white">Aktif</label>
                </div>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Sertifikat yang aktif akan ditampilkan di portfolio Anda.</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-4">
            <button type="submit" class="text-white bg-primary-700 hover:bg-primary-800 focus:ring-4 focus:outline-none focus:ring-primary-300 font-medium rounded-lg text-sm px-5 py-2.5 text-center dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800">
                <i class="fas fa-save mr-2"></i>{% if certificate %}Perbarui{% else %}Simpan{% endif %}
            </button>
            <button type="button" class="close-modal text-gray-500 bg-white hover:bg-gray-100 focus:ring-4 focus:outline-none focus:ring-primary-300 rounded-lg border border-gray-200 text-sm font-medium px-5 py-2.5 hover:text-gray-900 focus:z-10 dark:bg-gray-700 dark:text-gray-300 dark:border-gray-500 dark:hover:text-white dark:hover:bg-gray-600 dark:focus:ring-gray-600">
                <i class="fas fa-times mr-2"></i>Batal
            </button>
        </div>
    </form>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const form = document.getElementById('certificate-form');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Reset error messages
            document.querySelectorAll('.error-message').forEach(el => {
                el.classList.add('hidden');
                el.textContent = '';
            });
            
            const formData = new FormData(form);
            
            // Handle checkbox
            if (!formData.has('is_active')) {
                formData.append('is_active', 'off');
            }
            
            fetch(form.dataset.url, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'X-CSRFToken': formData.get('csrfmiddlewaretoken')
                }
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    // Close modal
                    closeModal();
                    
                    // Show success message
                    showToast('success', data.message);
                    
                    // Reload page after a short delay
                    setTimeout(() => {
                        window.location.reload();
                    }, 1000);
                } else {
                    // Show errors
                    if (data.errors) {
                        Object.keys(data.errors).forEach(key => {
                            const errorEl = document.getElementById(`${key}-error`);
                            if (errorEl) {
                                errorEl.textContent = data.errors[key].join(' ');
                                errorEl.classList.remove('hidden');
                            }
                        });
                    }
                    
                    // Show error message
                    showToast('error', data.message || 'Terjadi kesalahan. Silakan coba lagi.');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showToast('error', 'Terjadi kesalahan. Silakan coba lagi.');
            });
        });
    });
</script>
